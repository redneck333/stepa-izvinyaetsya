<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>степаизвиняется.exe</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#2a0f4f;
  --xp-border:#6a2fcc;
  --xp-face:#f7f1ff;
  --pink:#ff6fb5;
  --pink2:#ffb3dd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:Tahoma,Verdana,"Segoe UI",sans-serif;color:var(--ink);
  background:#7a45c9;
  background:radial-gradient(120% 80% at 50% 0%,#e6d2ff 0%,#b98cf2 35%,#8a52d6 70%,#5a2a9e 100%);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px);
  background-size:26px 26px;mask-image:linear-gradient(#000 0%,transparent 75%);-webkit-mask-image:linear-gradient(#000 0%,transparent 75%)}
.deco{position:fixed;pointer-events:none;color:#fff;opacity:.7;animation:floaty 6s ease-in-out infinite;text-shadow:0 0 8px #fff,0 0 2px #ff9ad5;z-index:0}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(12deg)}}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}

/* ---------- XP window ---------- */
.xp{background:var(--xp-face);border:3px solid var(--xp-border);border-top:0;border-radius:9px 9px 4px 4px;
  box-shadow:0 0 0 1px #3d1580,4px 6px 0 rgba(42,15,79,.25);overflow:hidden;display:flex;flex-direction:column}
.xp-title{height:28px;flex:0 0 28px;display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;color:#fff;
  font:bold 13px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px 0 #2d0b66;letter-spacing:.2px;
  background:linear-gradient(180deg,#d4b4ff 0%,#9a5cf0 9%,#8443e6 22%,#7434dc 55%,#6a2bd2 85%,#5520b4 100%);
  border-radius:7px 7px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.xp-title .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-title .heart{font-size:12px}
.xbtn{width:21px;height:21px;border:1px solid #fff;border-radius:3px;display:grid;place-items:center;
  background:linear-gradient(180deg,#b88cff,#7a3ee0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);color:#fff;font:bold 12px Tahoma;line-height:1;padding:0;cursor:pointer}
.xbtn.close{background:linear-gradient(180deg,#ff9a7a 0%,#e85a2e 45%,#c23a12 100%)}
.xp-body{padding:10px;flex:1;min-height:0}
.btn{font:13px Tahoma,Verdana,sans-serif;color:#1a0838;min-width:76px;padding:6px 14px;border-radius:4px;cursor:pointer;
  border:1px solid #3d1580;background:linear-gradient(180deg,#fff 0%,#f1e8ff 60%,#dccaff 100%);box-shadow:inset 0 -1px 0 rgba(90,40,170,.25)}
.btn:active{background:linear-gradient(180deg,#dccaff,#fff)}
.btn:disabled{color:#a99bbf;border-color:#c4b4dd;background:#f3eefa;box-shadow:none;cursor:default}
.btn.focus{outline:1px dotted #3d1580;outline-offset:-4px;box-shadow:0 0 0 1px #9a6bff inset}

/* ---------- header ---------- */
#hdr .xp-body{display:flex;align-items:center;gap:10px;padding:6px 10px}
#score{font:bold 26px "Trebuchet MS",Tahoma,sans-serif;color:#6a1fd0;letter-spacing:.5px;text-shadow:1px 1px 0 #ffd3ef}
#scoreLbl{font-size:11px;color:#7d5aa8;margin-top:-2px}
#rates{margin-left:auto;text-align:right;font-size:11.5px;line-height:1.5;color:#4b2a80}
#rates b{color:#d43c95}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;margin:6px 0;touch-action:none;cursor:pointer}
#stage::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:18px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(42,10,90,.45),transparent);pointer-events:none}
#stepa{position:absolute;inset:0;transform-origin:50% 100%;pointer-events:none}
#stepa img{position:absolute;bottom:4px;left:50%;height:96%;transform:translateX(-50%);opacity:0;pointer-events:none;
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px rgba(255,255,255,.9)) drop-shadow(0 8px 14px rgba(60,10,120,.35))}
#stepa img.on{opacity:1}
#stepa.ouch{animation:ouch .22s ease-out}
@keyframes ouch{0%{transform:scale(1,1)}30%{transform:scale(1.06,.9) translateY(2px) rotate(var(--r,2deg))}100%{transform:scale(1,1)}}
#stepa.squash{transition:transform .12s ease-out;transform:scale(1.25,.28) !important}
#stage.shake{animation:shake .25s linear}
#stage.bigshake{animation:shake .12s linear 6}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}

#hint{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:14px;
  padding:6px 12px;font:bold 14px "Trebuchet MS",Tahoma;white-space:nowrap;pointer-events:none;animation:bob 1s ease-in-out infinite;z-index:5;box-shadow:3px 3px 0 rgba(42,15,79,.3)}
@keyframes bob{50%{transform:translate(-50%,-6px)}}

.popup{position:absolute;width:min(150px,40%);pointer-events:none;z-index:6;animation:popin .14s ease-out;border-width:2px}
.popup .xp-title{height:21px;flex-basis:21px;font-size:11px;padding:0 3px 0 6px}
.popup .xbtn{width:15px;height:15px;font-size:9px;border-radius:2px}
.popup .xp-body{display:flex;gap:7px;align-items:flex-start;padding:7px 7px 6px;font-size:12px;line-height:1.3;flex-wrap:wrap}
.popup .xp-body svg{flex:0 0 26px;width:26px;height:26px}
.popup .msg{flex:1 1 calc(100% - 40px);min-width:0;overflow-wrap:break-word;padding-top:2px}
.popup .ok{display:block;margin:5px auto 0;min-width:50px;padding:2px 10px;font-size:11px}
.popup.out{animation:popout .25s ease-in forwards}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes popout{to{transform:scale(.85);opacity:0}}

.weap{position:absolute;width:70px;height:70px;pointer-events:none;z-index:8;margin:-62px 0 0 -14px;transform-origin:20% 90%;animation:swing .32s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes swing{0%{transform:rotate(-75deg) scale(1.15);opacity:1}55%{transform:rotate(18deg) scale(1)}80%{opacity:1}100%{transform:rotate(10deg);opacity:0}}
.num{position:absolute;pointer-events:none;z-index:9;font:900 22px "Trebuchet MS",Impact,sans-serif;color:#fff;
  -webkit-text-stroke:1.5px #6a1fd0;text-shadow:2px 2px 0 #ff6fb5;animation:rise .8s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:1}25%{transform:translate(-50%,-14px) scale(1.15)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.pnum{font-size:14px;-webkit-text-stroke:1px #6a1fd0;text-shadow:1px 1px 0 #ff6fb5;opacity:.9}
.bonkw{position:absolute;pointer-events:none;z-index:9;font:900 26px Impact,"Arial Black","Trebuchet MS",sans-serif;color:#ffe45c;
  -webkit-text-stroke:2px #3d0d75;text-shadow:3px 3px 0 #ff4fa3;animation:bonkw .55s ease-out forwards;letter-spacing:1px}
@keyframes bonkw{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.3)}30%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.2)}80%{opacity:1}100%{transform:translate(-50%,-60%) rotate(var(--r)) scale(1);opacity:0}}
.part{position:absolute;pointer-events:none;z-index:7;font-size:16px;color:var(--c);animation:burst .7s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4) rotate(var(--rot));opacity:0}}
.pemo{position:absolute;pointer-events:none;z-index:7;font-size:24px;animation:pemo .9s ease-out forwards}
@keyframes pemo{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(-15deg);opacity:1}50%{transform:translate(-50%,-50%) scale(1) rotate(10deg)}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}

/* ---------- piano ---------- */
#piano{position:absolute;left:50%;bottom:10%;width:86%;max-width:360px;transform:translate(-50%,-160vh);z-index:10;pointer-events:none;display:none}
#piano.show{display:block}
#piano.fall{transition:transform .65s cubic-bezier(.6,0,1,.6);transform:translate(-50%,0)}
#piano.landed{transform:translate(-50%,0);animation:land .35s ease-out}
@keyframes land{0%{transform:translate(-50%,0) scale(1.08,.88)}60%{transform:translate(-50%,-8px) scale(.97,1.04)}100%{transform:translate(-50%,0)}}
.dust{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0%,#e9dbff 60%,transparent 70%);pointer-events:none;z-index:11;animation:dust 1.1s ease-out forwards}
@keyframes dust{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.6);opacity:0}}
.star{position:absolute;z-index:12;color:#ffe45c;font-size:22px;text-shadow:0 0 3px #3d0d75;pointer-events:none;animation:orbit 1.2s linear infinite}
@keyframes orbit{from{transform:rotate(0deg) translateX(46px) rotate(0deg)}to{transform:rotate(360deg) translateX(46px) rotate(-360deg)}}

/* ---------- shop ---------- */
#shop{height:40%;min-height:220px}
.tabs{display:flex;gap:3px;padding:6px 8px 0;background:var(--xp-face)}
.tab{flex:1;font:bold 12.5px Tahoma,sans-serif;padding:7px 4px;border:1px solid #9b7fd0;border-bottom:0;border-radius:6px 6px 0 0;
  background:linear-gradient(#fbf8ff,#e6dbf7);color:#5b3a92;cursor:pointer}
.tab.on{background:#fff;color:var(--ink);border-color:var(--xp-border);border-top:3px solid #ff8ac6;position:relative;top:1px}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#fff;border-top:1px solid var(--xp-border);padding:4px 6px 8px}
.row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px dashed #e2d5f5}
.row:last-child{border-bottom:0}
.ic{flex:0 0 44px;width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-size:27px;
  background:linear-gradient(145deg,#fbeaff,#e6d4ff);border:1px solid #cdb5f0}
.ic svg{width:38px;height:38px}
.info{flex:1;min-width:0}
.nm{font:bold 14px "Trebuchet MS",Tahoma,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:11.5px;color:#7a5ca6;margin-top:1px}
.ds b{color:#d43c95}
.cnt{font:bold 12px Tahoma;color:#fff;background:#b06cff;border-radius:9px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.buy{min-width:74px;padding:6px 6px;font-weight:bold;font-size:12.5px}
.row.lock .nm{color:#b5a3cf;letter-spacing:2px}
.row.lock .ic{filter:grayscale(1) opacity(.45)}
.row.own .buy{color:#2b8a3e;border-color:#8fd19e;background:#ecfff0}
.row.cur{background:linear-gradient(90deg,#fff0fa,transparent)}
.row.fin .nm{color:#d43c95}

/* ---------- full screen windows ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(40,10,80,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.overlay .xp{width:100%;max-width:460px;max-height:100%;animation:popin .2s ease-out}
.big .xp-body{padding:18px 16px 14px;overflow:auto}
.letter{display:flex;gap:12px;align-items:flex-start}
.letter svg{flex:0 0 40px;width:40px;height:40px}
.letter p{margin:0 0 12px;font-size:16px;line-height:1.5}
.sign{text-align:right;font:italic 15px Georgia,serif;color:#8a2f9e;margin:4px 0 16px}
.btns{display:flex;justify-content:center;gap:12px}
.q{font:bold 26px "Trebuchet MS",Tahoma;margin:6px 0 22px;display:flex;align-items:center;gap:14px;justify-content:center}
.q svg{width:48px;height:48px;flex:0 0 48px}
.q2{font:900 44px Impact,"Arial Black","Trebuchet MS",sans-serif;text-align:center;margin:10px 0 18px;line-height:1.05}
.win{color:#ff4fa3;-webkit-text-stroke:1.5px #6a1fd0;text-shadow:3px 3px 0 #ffd3ef;animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.lose{color:#5d5470;font-size:40px}
body.gray #app{filter:grayscale(.85) brightness(.85);transition:filter 1.2s}
.conf{position:fixed;top:-40px;z-index:60;pointer-events:none;font-size:var(--s);color:var(--c);animation:fall var(--d) linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.small{font-size:11px;color:#8e78b0;text-align:center;margin-top:12px}
</style>
</head>

var AC=null, master=null;
function audio(){
  if(AC){if(AC.state==="suspended")AC.resume();return;}
  var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  AC=new C(); master=AC.createGain(); master.gain.value=.8;
  var comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
}
function noiseBuf(dur){var n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function bonk(level){
  if(!AC)return; var t=AC.currentTime, f0=(330-level*18)*rnd(.9,1.1);
  var lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500-level*60; lp.Q.value=.7; lp.connect(master);
  var o=AC.createOscillator(),g=AC.createGain(); o.type="sine";
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*.32,t+.16);
  env(g,t,.004,.95,.22); o.connect(g); g.connect(lp); o.start(t); o.stop(t+.3);
  var o2=AC.createOscillator(),g2=AC.createGain(); o2.type="triangle"; o2.frequency.setValueAtTime(f0*2.6,t); o2.frequency.exponentialRampToValueAtTime(f0*1.2,t+.05);
  env(g2,t,.002,.35,.06); o2.connect(g2); g2.connect(lp); o2.start(t); o2.stop(t+.1);
  var n=AC.createBufferSource(),gn=AC.createGain(),bp=AC.createBiquadFilter(); n.buffer=noiseBuf(.12); bp.type="bandpass"; bp.frequency.value=700; bp.Q.value=.8;
  env(gn,t,.002,.5+level*.04,.07); n.connect(bp); bp.connect(gn); gn.connect(lp); n.start(t);
  if(level>=4){var s=AC.createOscillator(),gs=AC.createGain(); s.type="sine"; s.frequency.setValueAtTime(110,t); s.frequency.exponentialRampToValueAtTime(40,t+.25);
    env(gs,t,.004,.6+level*.03,.3); s.connect(gs); gs.connect(master); s.start(t); s.stop(t+.4);}
  if(level===5){var r=AC.createOscillator(),gr=AC.createGain(); r.type="sine"; r.frequency.value=rnd(1150,1300); env(gr,t,.002,.18,.6); r.connect(gr); gr.connect(master); r.start(t); r.stop(t+.7);}
}
function whistle(){ if(!AC)return; var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(); o.type="sine";
  o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(260,t+.65); g.gain.setValueAtTime(.25,t); g.gain.linearRampToValueAtTime(.3,t+.6); g.gain.exponentialRampToValueAtTime(.001,t+.7);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+.72);}
function crash(){ if(!AC)return; var t=AC.currentTime;
  var n=AC.createBufferSource(),gn=AC.createGain(),lp=AC.createBiquadFilter(); n.buffer=noiseBuf(1.6); lp.type="lowpass"; lp.frequency.setValueAtTime(5000,t); lp.frequency.exponentialRampToValueAtTime(300,t+1.4);
  env(gn,t,.005,.9,1.4); n.connect(lp); lp.connect(gn); gn.connect(master); n.start(t);
  var s=AC.createOscillator(),gs=AC.createGain(); s.frequency.setValueAtTime(90,t); s.frequency.exponentialRampToValueAtTime(30,t+.6); env(gs,t,.005,1,.7); s.connect(gs); gs.connect(master); s.start(t); s.stop(t+.8);
  [55,58.3,82.4,87.3,110,116.5,164.8,174.6,233,246.9,329.6,349.2].forEach(function(f){
    var o=AC.createOscillator(),g=AC.createGain(); o.type="triangle"; o.frequency.value=f*rnd(.995,1.005); var d=rnd(1.5,3);
    env(g,t+rnd(0,.04),.004,.12,d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.2);});
}
function tune(notes,type,step,dur,vol){ if(!AC)return; var t=AC.currentTime+.05;
  notes.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter(); o.type=type; o.frequency.value=f; lp.type="lowpass"; lp.frequency.value=2200;
    var st=t+i*step, d=(i===notes.length-1)?dur*2.5:dur;
    if(type==="sawtooth"){var v=AC.createOscillator(),vg=AC.createGain();v.frequency.value=6;vg.gain.value=f*.02;v.connect(vg);vg.connect(o.frequency);v.start(st);v.stop(st+d+.1);}
    g.gain.setValueAtTime(.0001,st); g.gain.exponentialRampToValueAtTime(vol,st+.02); g.gain.setValueAtTime(vol,st+d*.7); g.gain.exponentialRampToValueAtTime(.0001,st+d);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(st); o.stop(st+d+.05);});
}

var last=performance.now(), acc=0, fxAcc=0, saveAcc=0;
function loop(now){
  var dt=Math.min(.5,(now-last)/1000); last=now;
  if(!S.fin){var g=pps()*dt; S.pts+=g;}
  acc+=dt; fxAcc+=dt; saveAcc+=dt;
  if(acc>.1){acc=0;ui();}
  if(fxAcc>1.1){fxAcc=0;passiveFx();}
  if(saveAcc>3){saveAcc=0;save();}
  requestAnimationFrame(loop);
}
